<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>音谋加 - AI音乐分享</title>
    <meta property="og:title" content="音谋加 - AI音乐分享">
    <meta property="og:description" content="我用音谋加创作了这首AI专属音乐，快来听听！">
    <meta property="og:type" content="music.song">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%); min-height: 100vh; color: #fff; }
        .container { max-width: 420px; margin: 0 auto; padding: 20px; min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; }

        .loading { text-align: center; color: #666; font-size: 14px; padding: 60px 0; }
        .error { text-align: center; color: #ff6b6b; font-size: 14px; padding: 60px 0; }

        .share-card { width: 100%; text-align: center; }
        .share-badge { display: inline-block; background: linear-gradient(90deg, #00d9ff, #00ff88); color: #1a1a2e; padding: 5px 16px; border-radius: 20px; font-size: 12px; font-weight: bold; margin-bottom: 20px; }
        .album-cover { width: 240px; height: 240px; border-radius: 24px; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); margin: 0 auto 20px; display: flex; justify-content: center; align-items: center; font-size: 90px; box-shadow: 0 20px 50px rgba(102, 126, 234, 0.4); overflow: hidden; }
        .album-cover img { width: 100%; height: 100%; object-fit: cover; }
        .music-title { font-size: 24px; font-weight: bold; margin-bottom: 6px; }
        .music-artist { color: #888; font-size: 13px; margin-bottom: 24px; }

        /* 歌词 */
        .lyrics-box { background: rgba(255,255,255,0.05); border-radius: 16px; padding: 16px; margin: 20px 0; max-height: 200px; overflow-y: auto; white-space: pre-wrap; line-height: 1.9; font-size: 14px; color: #ccc; text-align: center; }
        .lyrics-box::-webkit-scrollbar { width: 3px; }
        .lyrics-box::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.15); border-radius: 2px; }

        /* 播放器 */
        .player-card { width: 100%; background: rgba(255,255,255,0.08); border-radius: 18px; padding: 20px; margin: 16px 0; }
        .player-progress { width: 100%; height: 4px; background: rgba(255,255,255,0.12); border-radius: 2px; overflow: hidden; margin-bottom: 8px; cursor: pointer; }
        .player-progress-bar { height: 100%; background: linear-gradient(90deg, #00d9ff, #00ff88); width: 0%; transition: width 0.1s linear; }
        .player-time { display: flex; justify-content: space-between; font-size: 12px; color: #666; margin-bottom: 16px; }
        .player-controls { display: flex; justify-content: center; align-items: center; gap: 28px; }
        .play-btn { width: 60px; height: 60px; background: linear-gradient(90deg, #00d9ff, #00ff88); border-radius: 50%; border: none; display: flex; justify-content: center; align-items: center; font-size: 24px; cursor: pointer; }
        .play-btn:active { transform: scale(0.95); }
        .control-btn { background: none; border: none; font-size: 24px; cursor: pointer; opacity: 0.5; }
        .control-btn:hover { opacity: 1; }

        /* 歌曲切换 */
        .song-tabs { display: flex; gap: 10px; margin-bottom: 16px; }
        .song-tab { flex: 1; padding: 10px; background: rgba(255,255,255,0.06); border: 2px solid transparent; border-radius: 12px; text-align: center; cursor: pointer; transition: all 0.2s; }
        .song-tab.active { border-color: #00d9ff; background: rgba(0,217,255,0.1); }
        .song-tab-num { font-size: 11px; color: #666; }
        .song-tab-title { font-size: 12px; color: #ccc; margin-top: 4px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

        /* 操作按钮 */
        .action-btns { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin: 16px 0; }
        .action-btn { background: rgba(255,255,255,0.08); border: none; border-radius: 13px; padding: 14px; text-align: center; cursor: pointer; color: #fff; }
        .action-btn:active { transform: scale(0.97); }
        .action-btn .icon { font-size: 22px; margin-bottom: 4px; }
        .action-btn .label { font-size: 12px; color: #888; }

        /* CTA */
        .cta-btn { width: 100%; padding: 16px; background: linear-gradient(90deg, #00d9ff, #00ff88); border: none; border-radius: 16px; font-size: 16px; font-weight: bold; color: #1a1a2e; cursor: pointer; margin-top: 16px; }
        .cta-btn:active { transform: scale(0.98); }

        .footer { text-align: center; padding: 24px 0; color: #444; font-size: 11px; }
        .brand-mark { margin-top: 12px; color: #555; font-size: 12px; }
    </style>
</head>
<body>
<div class="container" id="app">
    <div class="loading" id="loadingEl">加载中...</div>
</div>

<script>
const API_BASE = '';
const params = new URLSearchParams(window.location.search);
const shareId = params.get('id');

if (!shareId) {
    document.getElementById('app').innerHTML = '<div class="error">分享内容不存在</div>';
} else {
    loadShare(shareId);
}

let audioPlayer = null;
let isPlaying = false;
let currentShare = null;
let currentSongIndex = 0;

async function loadShare(id) {
    try {
        const res = await fetch(`${API_BASE}/api/share/${id}`);
        const json = await res.json();
        if (!json.success) {
            document.getElementById('app').innerHTML = '<div class="error">分享内容不存在或已过期</div>';
            return;
        }
        currentShare = json.data;
        renderShare(currentShare);
    } catch (e) {
        document.getElementById('app').innerHTML = '<div class="error">加载失败，请检查网络</div>';
    }
}

function renderShare(data) {
    const songs = data.songs || [];
    if (songs.length === 0) {
        document.getElementById('app').innerHTML = '<div class="error">歌曲数据为空</div>';
        return;
    }

    // 歌曲Tab
    let songTabsHtml = '';
    if (songs.length >= 2) {
        songTabsHtml = '<div class="song-tabs">';
        songs.forEach((s, i) => {
            songTabsHtml += `<div class="song-tab ${i === 0 ? 'active' : ''}" id="songTab${i}" onclick="switchSong(${i})"><div class="song-tab-num">歌曲 ${i + 1}</div><div class="song-tab-title">${escHtml(s.title || '未命名')}</div></div>`;
        });
        songTabsHtml += '</div>';
    }

    // 更新页面标题
    document.title = (songs[0].title || '音谋加') + ' - 音谋加 AI音乐';

    document.getElementById('app').innerHTML = `
        <div class="share-card">
            <div class="share-badge">🎵 AI 专属创作</div>
            ${songTabsHtml}
            <div class="album-cover" id="albumCover">🎵</div>
            <div class="music-title" id="musicTitle">${escHtml(songs[0].title || 'AI音乐')}</div>
            <div class="music-artist">by 音谋加 × 大树音乐</div>

            <div class="lyrics-box" id="lyricsBox" style="display:none"></div>

            <div class="player-card">
                <div class="player-progress" onclick="seekAudio(event)">
                    <div class="player-progress-bar" id="progressBar"></div>
                </div>
                <div class="player-time">
                    <span id="currentTime">0:00</span>
                    <span id="totalTime">--:--</span>
                </div>
                <div class="player-controls">
                    <button class="control-btn" onclick="seekBack()">⏮️</button>
                    <button class="play-btn" id="playBtn" onclick="togglePlay()">▶️</button>
                    <button class="control-btn" onclick="seekForward()">⏭️</button>
                </div>
            </div>

            <div class="action-btns">
                <button class="action-btn" onclick="downloadCurrent()">
                    <div class="icon">💾</div><div class="label">保存MP3</div>
                </button>
                <button class="action-btn" onclick="shareAgain()">
                    <div class="icon">📤</div><div class="label">分享给朋友</div>
                </button>
            </div>

            <button class="cta-btn" onclick="window.location.href='/index.html'">🎵 我也要创作一首</button>

            <div class="footer">© 大树音乐 · 纳心治愈系</div>
        </div>
    `;

    // 加载第一首歌
    applySong(0);
}

function switchSong(index) {
    currentSongIndex = index;
    document.querySelectorAll('.song-tab').forEach((t, i) => t.classList.toggle('active', i === index));
    applySong(index);
}

function applySong(index) {
    const song = currentShare.songs[index];
    if (!song) return;

    document.getElementById('musicTitle').textContent = song.title || 'AI音乐';

    // 歌词
    const lyricsEl = document.getElementById('lyricsBox');
    if (song.lyrics && song.lyrics !== '[Instrumental]') {
        lyricsEl.textContent = song.lyrics;
        lyricsEl.style.display = 'block';
    } else {
        lyricsEl.style.display = 'none';
    }

    // 封面
    const cover = document.getElementById('albumCover');
    if (song.imageUrl) {
        cover.innerHTML = `<img src="${escAttr(song.imageUrl)}" onerror="this.parentElement.innerHTML='🎵'">`;
    } else {
        cover.innerHTML = '🎵';
    }

    // 音频
    if (audioPlayer) { audioPlayer.pause(); audioPlayer = null; }
    isPlaying = false;
    document.getElementById('playBtn').textContent = '▶️';
    document.getElementById('progressBar').style.width = '0%';
    document.getElementById('currentTime').textContent = '0:00';
    document.getElementById('totalTime').textContent = '--:--';

    if (song.audioUrl) {
        audioPlayer = new Audio(song.audioUrl);
        audioPlayer.addEventListener('loadedmetadata', () => {
            const m = Math.floor(audioPlayer.duration / 60);
            const s = Math.floor(audioPlayer.duration % 60);
            document.getElementById('totalTime').textContent = `${m}:${s.toString().padStart(2,'0')}`;
        });
        audioPlayer.addEventListener('ended', () => {
            isPlaying = false;
            document.getElementById('playBtn').textContent = '▶️';
            document.getElementById('progressBar').style.width = '0%';
        });
        audioPlayer.addEventListener('timeupdate', () => {
            if (audioPlayer.duration) {
                const pct = (audioPlayer.currentTime / audioPlayer.duration) * 100;
                document.getElementById('progressBar').style.width = pct + '%';
                const m = Math.floor(audioPlayer.currentTime / 60);
                const s = Math.floor(audioPlayer.currentTime % 60);
                document.getElementById('currentTime').textContent = `${m}:${s.toString().padStart(2,'0')}`;
            }
        });
    }
}

function togglePlay() {
    if (!audioPlayer) return;
    isPlaying = !isPlaying;
    document.getElementById('playBtn').textContent = isPlaying ? '⏸️' : '▶️';
    if (isPlaying) audioPlayer.play().catch(() => {
        isPlaying = false;
        document.getElementById('playBtn').textContent = '▶️';
    });
    else audioPlayer.pause();
}

function seekBack() { if (audioPlayer) audioPlayer.currentTime = 0; }
function seekForward() { if (audioPlayer && audioPlayer.duration) audioPlayer.currentTime = audioPlayer.duration - 1; }
function seekAudio(e) {
    if (!audioPlayer || !audioPlayer.duration) return;
    const rect = e.target.getBoundingClientRect();
    audioPlayer.currentTime = ((e.clientX - rect.left) / rect.width) * audioPlayer.duration;
}

function downloadCurrent() {
    const song = currentShare.songs[currentSongIndex];
    if (!song || !song.audioUrl) return;
    const url = `${API_BASE}/api/proxy-download?url=${encodeURIComponent(song.audioUrl)}&title=${encodeURIComponent(song.title || 'music')}`;
    const a = document.createElement('a');
    a.href = url; a.download = (song.title || 'music') + '.mp3'; a.target = '_blank';
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
}

function shareAgain() {
    const title = currentShare.songs[currentSongIndex]?.title || '音谋加 AI音乐';
    const url = window.location.href;
    if (navigator.share) {
        navigator.share({ title: '🎵 ' + title, text: `我用音谋加创作了「${title}」，快来听听！`, url });
    } else {
        const text = `我用音谋加创作了「${title}」，快来听听！\n${url}`;
        if (navigator.clipboard) {
            navigator.clipboard.writeText(text).then(() => alert('链接已复制！'));
        }
    }
}

function escHtml(s) { var d = document.createElement('div'); d.textContent = s; return d.innerHTML; }
function escAttr(s) { return s.replace(/"/g, '&quot;').replace(/'/g, '&#39;'); }
</script>
</body>
</html>
